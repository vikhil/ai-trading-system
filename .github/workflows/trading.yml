name: Trading Bot

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

jobs:
  run-script:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Libraries
      run: pip install -r requirements.txt

    - name: Run Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python main.py
