name: Trading Bot

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

# ============================================================
# WORKFLOW CONCURRENCY
# ============================================================
#
# Prevent two Trading Bot runs from executing simultaneously.
# This is particularly important because the workflow:
#
# 1. Updates NSE classification
# 2. Writes checkpoint data
# 3. Pushes changes to Git
# 4. Runs the resolver
#
# ============================================================

concurrency:
  group: trading-bot
  cancel-in-progress: false


jobs:

  run-script:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ========================================================
      # INSTALL LIBRARIES
      # ========================================================

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================================
      # GOOGLE FINANCE / MARKET DIAGNOSTIC
      # ========================================================

      - name: Run Google Finance Sector Industry Diagnostic
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python diagnostics/google_finance_sector_industry_diagnostic.py

      # ========================================================
      # UPDATE NSE COMPANY CLASSIFICATION
      # ========================================================
      #
      # Retrieves NSE classification information and updates:
      #
      #   data/nse_industry_classification.csv
      #
      # and/or:
      #
      #   data/nse_classification_checkpoint.json
      #
      # The resolver runs AFTER this step.
      #
      # ========================================================

      - name: Update NSE Industry Classification
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          NSE_CLASSIFICATION_MAX_RETRIES: "2"
          NSE_CLASSIFICATION_TIMEOUT: "30"

          NSE_CLASSIFICATION_MIN_DELAY: "5"
          NSE_CLASSIFICATION_MAX_DELAY: "10"

          NSE_CLASSIFICATION_CHECKPOINT_EVERY: "5"

        run: |
          python diagnostics/update_nse_industry_classification.py

      # ========================================================
      # SHOW NSE CLASSIFICATION FILES
      # ========================================================
      #
      # Diagnostic step so we can immediately see whether the
      # NSE collector actually produced the files expected by
      # resolve_sector_industry.py.
      #
      # ========================================================

      - name: Verify NSE classification files
        if: always()
        run: |
          echo "============================================================"
          echo "NSE CLASSIFICATION FILE CHECK"
          echo "============================================================"

          if [ -f data/nse_industry_classification.csv ]; then
            echo "✓ NSE classification CSV found"
            echo "File size:"
            wc -c data/nse_industry_classification.csv

            echo ""
            echo "CSV header:"
            head -n 1 data/nse_industry_classification.csv

            echo ""
            echo "CSV record count:"
            tail -n +2 data/nse_industry_classification.csv | wc -l
          else
            echo "✗ NSE classification CSV NOT FOUND"
          fi

          echo ""

          if [ -f data/nse_classification_checkpoint.json ]; then
            echo "✓ NSE checkpoint found"
            echo "File size:"
            wc -c data/nse_classification_checkpoint.json
          else
            echo "✗ NSE checkpoint NOT FOUND"
          fi

          echo ""
          echo "============================================================"

      # ========================================================
      # SAVE NSE CLASSIFICATION DATA
      # ========================================================
      #
      # Persist the NSE classification CSV and checkpoint so
      # subsequent GitHub Actions runs can reuse previously
      # collected data.
      #
      # ========================================================

      - name: Save NSE classification data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking NSE classification files for changes..."

          git add data/nse_classification_checkpoint.json 2>/dev/null || true
          git add data/nse_industry_classification.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update NSE classification data"

            # Refresh remote state before pushing.
            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No NSE classification changes to commit."
          fi

      # ========================================================
      # RESOLVE STOCK MASTER CLASSIFICATIONS
      # ========================================================
      #
      # Resolver hierarchy:
      #
      #   1. NSE classification CSV
      #   2. NSE checkpoint
      #   3. NOT_RESOLVED
      #
      # The resolver does NOT:
      #
      #   - use BSE classification
      #   - use Yahoo sector/industry
      #   - call NSE live endpoints
      #   - guess classifications
      #
      # ========================================================

      - name: Resolve NSE Sector and Industry
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          NSE_CLASSIFICATION_FILE: data/nse_industry_classification.csv

          NSE_CLASSIFICATION_CHECKPOINT: data/nse_classification_checkpoint.json

        run: |
          python diagnostics/resolve_sector_industry.py

      # ========================================================
      # WORKFLOW SUMMARY
      # ========================================================

      - name: Workflow Summary
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "TRADING BOT WORKFLOW COMPLETED"
          echo "============================================================"
          echo ""
          echo "NSE classification flow:"
          echo ""
          echo "Stock_Master"
          echo "     ↓"
          echo "NSE classification CSV"
          echo "     ↓"
          echo "NSE checkpoint fallback"
          echo "     ↓"
          echo "NSE_Sector_Industry_Diagnostic"
          echo ""
          echo "============================================================"
