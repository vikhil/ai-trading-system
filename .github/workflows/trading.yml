name: Trading Bot

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:

  run-script:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # 2. PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ========================================================
      # 3. INSTALL LIBRARIES
      # ========================================================

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================================
      # 4. GOOGLE FINANCE DIAGNOSTIC
      # ========================================================

      - name: Run Google Finance Sector Industry Diagnostic
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python diagnostics/google_finance_sector_industry_diagnostic.py

      # ========================================================
      # 5. NSE COLLECTOR
      # ========================================================
      #
      # IMPORTANT:
      # This MUST complete before the resolver runs.
      #
      # Output:
      #
      # data/nse_industry_classification.csv
      # data/nse_classification_checkpoint.json
      #
      # ========================================================

      - name: Update NSE Industry Classification
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          NSE_CLASSIFICATION_MAX_RETRIES: "2"
          NSE_CLASSIFICATION_TIMEOUT: "30"

          NSE_CLASSIFICATION_MIN_DELAY: "5"
          NSE_CLASSIFICATION_MAX_DELAY: "10"

          NSE_CLASSIFICATION_CHECKPOINT_EVERY: "5"

        run: |
          python diagnostics/update_nse_industry_classification.py

      # ========================================================
      # 6. VERIFY NSE DATA
      # ========================================================

      - name: Verify NSE classification files
        if: always()
        run: |

          echo "============================================================"
          echo "NSE CLASSIFICATION FILE CHECK"
          echo "============================================================"

          if [ -f data/nse_industry_classification.csv ]; then

            echo "✓ NSE classification CSV found"

            echo ""
            echo "File size:"
            wc -c data/nse_industry_classification.csv

            echo ""
            echo "CSV header:"
            head -n 1 data/nse_industry_classification.csv

            echo ""
            echo "CSV record count:"
            tail -n +2 \
              data/nse_industry_classification.csv | wc -l

          else

            echo "✗ NSE classification CSV NOT FOUND"

          fi

          echo ""

          if [ -f data/nse_classification_checkpoint.json ]; then

            echo "✓ NSE checkpoint found"

            echo ""
            echo "File size:"
            wc -c data/nse_classification_checkpoint.json

          else

            echo "✗ NSE checkpoint NOT FOUND"

          fi

          echo ""
          echo "============================================================"

      # ========================================================
      # 7. PERSIST NSE DATA
      # ========================================================
      #
      # This is for FUTURE GitHub Actions runs.
      #
      # The resolver does NOT depend on this push.
      # It reads the files directly from the current workspace.
      #
      # ========================================================

      - name: Save NSE classification data
        if: always()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking NSE classification files..."

          git fetch origin "${GITHUB_REF_NAME}"

          git rebase "origin/${GITHUB_REF_NAME}" || {

            echo "WARNING: Git rebase failed."

            git rebase --abort || true

            exit 1

          }

          git add \
            data/nse_classification_checkpoint.json \
            data/nse_industry_classification.csv \
            2>/dev/null || true

          if git diff --cached --quiet; then

            echo "No NSE classification changes."

          else

            git commit \
              -m "Update NSE classification data"

            git push \
              origin \
              "HEAD:${GITHUB_REF_NAME}"

          fi

      # ========================================================
      # 8. RESOLVE NSE SECTOR / INDUSTRY
      # ========================================================
      #
      # IMPORTANT:
      #
      # This runs ONLY after the NSE collector has completed.
      #
      # Resolver hierarchy:
      #
      # 1. Complete NSE CSV
      # 2. Complete checkpoint
      # 3. Partial NSE CSV
      # 4. Partial checkpoint
      # 5. NOT_RESOLVED
      #
      # ========================================================

      - name: Resolve NSE Sector and Industry
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          NSE_CLASSIFICATION_FILE: data/nse_industry_classification.csv

          NSE_CLASSIFICATION_CHECKPOINT: data/nse_classification_checkpoint.json

        run: |
          python diagnostics/resolve_sector_industry.py

      # ========================================================
      # 9. RUN TRADING BOT
      # ========================================================
      #
      # IMPORTANT:
      #
      # This runs main.py only after:
      #
      # 1. Google Finance diagnostic
      # 2. NSE classification collector
      # 3. NSE classification verification
      # 4. NSE data persistence
      # 5. NSE sector / industry resolver
      #
      # main.py therefore receives the latest resolved
      # Stock_Master data during the same workflow run.
      #
      # ========================================================

      - name: Run Trading Bot
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

        run: |
          python main.py    
      
      # ========================================================
      # 10. WORKFLOW SUMMARY
      # ========================================================
